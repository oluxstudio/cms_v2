# Attaches the app to the VPS-wide Traefik edge (see /srv/edge on the server):
# joins the external `edge` network and declares its own domain via labels.
# deploy.sh includes this file automatically when present.
#   docker compose -f docker-compose.prod.yml -f docker-compose.traefik.yml up -d
services:
  app:
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.cms.rule=Host(`cms.oluxstudio.com`)
      - traefik.http.routers.cms.entrypoints=websecure
      - traefik.http.routers.cms.tls.certresolver=le
      - traefik.http.services.cms.loadbalancer.server.port=80
networks:
  edge:
    external: true
