# Attaches the app to the VPS-wide Traefik edge (see /srv/edge on the server):
# joins the external `edge` network and declares its own domain via labels.
# deploy.sh includes this file automatically when present.
#   docker compose -f docker-compose.prod.yml -f docker-compose.traefik.yml up -d
services:
  app:
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.cms.rule=Host(`cms.oluxstudio.com`)
      - traefik.http.routers.cms.entrypoints=websecure
      - traefik.http.routers.cms.tls.certresolver=le
      - traefik.http.services.cms.loadbalancer.server.port=80
      # Instant site subdomains ({site}.oluxstudio.com). TLS at the edge comes
      # from the Cloudflare proxy (SSL mode "Full"), so this router only needs
      # Traefik's default certificate — no ACME per subdomain. Priority 1 so
      # explicit Host() routers (cms, hairco, v2hairco…) always win.
      - traefik.http.routers.cms-sites.rule=HostRegexp(`^[a-z0-9-]+\.oluxstudio\.com$`)
      - traefik.http.routers.cms-sites.entrypoints=websecure
      - traefik.http.routers.cms-sites.tls=true
      - traefik.http.routers.cms-sites.priority=1
      - traefik.http.routers.cms-sites.service=cms
networks:
  edge:
    external: true
