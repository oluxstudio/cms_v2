# CI/CD pipeline — build once, ship everywhere.
#
#   push to main ─► tests (reusable tests.yml, real MySQL)
#                ─► build   (docker image → ghcr.io/oluxstudio/cms_v2:latest + :sha-<commit>)
#                ─► deploy  (VPS pulls the EXACT tested image and restarts)
#
# The deploy job is bound to the GitHub environment "production" — its
# secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY) live on that environment
# (repo Settings → Environments → production).
#
# Adding STAGING later: create environment "staging" with its own VPS_*
# secrets, then duplicate the deploy job with `environment: staging`
# triggered by a `staging` branch (or a workflow_dispatch input). The
# tests + build jobs are shared — staging pulls the same image.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cms_v2

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [tests, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH (pull tested image, restart, migrate)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ vars.VPS_APP_DIR || '/var/www/cms-app/cms_v2' }}
            git fetch origin main
            git checkout origin/main -- deploy.sh
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./deploy.sh sha-${{ github.sha }}
            docker logout ghcr.io
