# Test suite — runs on PRs/pushes AND as a reusable job (workflow_call)
# gating the deploy pipeline. Mirrors the local container setup: MySQL 8
# with both the app DB and the `testing` DB the Pest suite migrates into.
name: tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Configure Environment For CI
        run: |
          for kv in DB_HOST=127.0.0.1 DB_USERNAME=root DB_PASSWORD=root MAIL_MAILER=log; do
            key="${kv%%=*}"
            sed -i "s|^${key}=.*|${kv}|" .env
          done

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Create Databases
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS olux_cms; CREATE DATABASE IF NOT EXISTS testing;"

      - name: Run Migrations
        run: |
          php artisan migrate --force
          DB_DATABASE=testing php artisan migrate --force

      - name: Run Tests
        run: ./vendor/bin/pest
