# ── nginx vhost for cms.oluxstudio.com (host-level, in front of the app) ─────
# The app container listens on 127.0.0.1:8080 (APP_HTTP_PORT in the server
# .env — keep these two in sync). nginx terminates TLS and MUST forward the
# scheme/IP headers below: Laravel (trustProxies) uses them to generate
# https URLs and see real client IPs. Missing X-Forwarded-Proto = mixed
# content = broken styles.
#
# Install / update (after git pull):
#   cp infra/nginx/cms.oluxstudio.com.conf /etc/nginx/sites-available/cms.oluxstudio.com
#   ln -sf /etc/nginx/sites-available/cms.oluxstudio.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# If your certbot cert paths differ, keep your existing ssl_certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name cms.oluxstudio.com;

    # ACME renewals pass through; everything else goes to https.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.oluxstudio.com;

    ssl_certificate     /etc/letsencrypt/live/cms.oluxstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.oluxstudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The media API accepts uploads up to 50 MB.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Site generation / export requests can run long.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
