<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <!-- floor ring: full ellipse drawn first so its back arc passes behind the stand -->
  <ellipse cx="280" cy="452" rx="235" ry="66" fill="none" stroke="#e8703a" stroke-width="2.5"/>

  <!-- floor shadow -->
  <ellipse cx="280" cy="480" rx="170" ry="26" fill="#000" opacity=".08"/>

  <!-- back panel between the side panels -->
  <rect x="150" y="90" width="260" height="180" fill="#d9bb97"/>

  <!-- ===== tiered display books (back row first, each row lower & in front) ===== -->
  <!-- row 1 (top, behind) -->
  <g>
    <rect x="188" y="96" width="50" height="70" rx="4" fill="#4f9e46" transform="rotate(-5 213 131)"/>
    <rect x="246" y="90" width="52" height="72" rx="4" fill="#e2b73c" transform="rotate(2 272 126)"/>
    <rect x="306" y="94" width="50" height="70" rx="4" fill="#f2a333" transform="rotate(6 331 129)"/>
    <text x="213" y="136" text-anchor="middle" font-size="10" fill="#fff" font-family="sans-serif" transform="rotate(-5 213 131)">Jungle</text>
  </g>
  <!-- shelf lip row 1 -->
  <rect x="150" y="158" width="260" height="10" fill="#c6a37f"/>

  <!-- row 2 -->
  <g>
    <rect x="176" y="140" width="52" height="74" rx="4" fill="#4aa7d8" transform="rotate(-3 202 177)"/>
    <rect x="236" y="136" width="54" height="76" rx="4" fill="#efe9dc"/>
    <rect x="298" y="140" width="52" height="74" rx="4" fill="#7fb3e0" transform="rotate(4 324 177)"/>
    <text x="263" y="170" text-anchor="middle" font-size="9" fill="#2c7a3c" font-family="sans-serif">THE</text>
    <text x="263" y="182" text-anchor="middle" font-size="9" fill="#2c7a3c" font-family="sans-serif">BEGINNING</text>
  </g>
  <!-- shelf lip row 2 -->
  <rect x="150" y="206" width="260" height="10" fill="#c6a37f"/>

  <!-- row 3 (front, lowest) -->
  <g>
    <rect x="168" y="186" width="52" height="76" rx="4" fill="#3f7a52" transform="rotate(-4 194 224)"/>
    <rect x="228" y="186" width="54" height="78" rx="4" fill="#f7f4ec"/>
    <rect x="290" y="184" width="54" height="78" rx="4" fill="#eaf1f8" transform="rotate(3 317 223)"/>
    <text x="255" y="222" text-anchor="middle" font-size="8" fill="#c25c8a" font-family="sans-serif">Wiggly McGee</text>
    <text x="317" y="214" text-anchor="middle" font-size="8" fill="#1d5c9e" font-family="sans-serif" transform="rotate(3 317 223)">Mysterious</text>
    <text x="317" y="226" text-anchor="middle" font-size="8" fill="#1d5c9e" font-family="sans-serif" transform="rotate(3 317 223)">Lake Bandit</text>
  </g>

  <!-- front ledge that catches the front row -->
  <rect x="150" y="256" width="260" height="26" fill="#cfae88"/>
  <rect x="150" y="256" width="260" height="6" fill="#bd9a73"/>

  <!-- ===== lower cabinet with cubbies ===== -->
  <rect x="150" y="282" width="260" height="164" fill="#e0c3a0"/>
  <!-- cubby holes -->
  <rect x="166" y="298" width="68" height="132" fill="#a8865f"/>
  <rect x="246" y="298" width="68" height="132" fill="#a8865f"/>
  <rect x="326" y="298" width="68" height="132" fill="#a8865f"/>
  <!-- cubby inner shadow -->
  <rect x="166" y="298" width="68" height="10" fill="#8f6f4c"/>
  <rect x="246" y="298" width="68" height="10" fill="#8f6f4c"/>
  <rect x="326" y="298" width="68" height="10" fill="#8f6f4c"/>
  <!-- books standing in cubbies -->
  <rect x="178" y="316" width="40" height="114" rx="2" fill="#f2b53a"/>
  <text x="198" y="345" text-anchor="middle" font-size="9" fill="#7a5514" font-family="sans-serif">STORY</text>
  <rect x="258" y="320" width="40" height="110" rx="2" fill="#7fc8c0"/>
  <text x="278" y="356" text-anchor="middle" font-size="9" fill="#1c4a44" font-family="sans-serif">Once</text>
  <text x="278" y="368" text-anchor="middle" font-size="9" fill="#1c4a44" font-family="sans-serif">Upon</text>

  <!-- base plinth -->
  <rect x="144" y="446" width="272" height="18" rx="4" fill="#c6a37f"/>

  <!-- ===== rounded side panels (drawn last, in front of everything) ===== -->
  <path d="M110 464 V120 q0 -44 44 -44 h8 v388 z" fill="#e6cba9"/>
  <path d="M110 464 V120 q0 -44 44 -44 h8 v14 h-6 q-40 0 -40 38 v378 z" fill="#d3b28c"/>
  <path d="M450 464 V120 q0 -44 -44 -44 h-8 v388 z" fill="#dcbd97"/>
  <path d="M450 464 V120 q0 -44 -44 -44 h-8 v14 h6 q40 0 40 38 v378 z" fill="#c2a077"/>

  <!-- front arc of the ring redrawn on top, so the circle passes in front of the base -->
  <path d="M45 452 a235 66 0 0 0 470 0" fill="none" stroke="#e8703a" stroke-width="2.5"/>
</svg>
