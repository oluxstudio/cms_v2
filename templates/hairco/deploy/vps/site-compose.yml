# /srv/sites/<name>/docker-compose.yml — a fully self-contained static site.
# Copy this folder per site; change only the two label lines + router name.
#   cd /srv/sites/<name> && docker compose up -d
services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.hairco.rule=Host(`hairco.oluxstudio.com`)
      - traefik.http.routers.hairco.entrypoints=websecure
      - traefik.http.routers.hairco.tls.certresolver=le
    networks: [edge]

networks:
  edge:
    external: true
