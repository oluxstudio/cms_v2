# ── Production stack for cms.oluxstudio.com ─────────────────────────────────
#   docker compose -f docker-compose.prod.yml up -d
# The app image is BUILT ONCE in CI (deploy.yml) and pulled from GitHub's
# registry — the server never builds. IMAGE_TAG pins the exact tested commit
# (the deploy workflow exports it); `latest` is the manual-ops fallback.
# Env comes from the server-side .env (never commit it). The app image serves
# HTTP/HTTPS itself (FrankenPHP/Caddy) — no separate web server needed.

services:
  app:
    image: ghcr.io/oluxstudio/cms_v2:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # PROXY mode (default): nginx owns 80/443 on the host and proxies to this
    # loopback port. Safe-by-default: never binds public interfaces, never
    # races nginx for :80. Set APP_HTTP_PORT in the server .env if not 8080.
    # EDGE mode (Caddy owns 80/443, on-demand TLS): add the override file —
    #   docker compose -f docker-compose.prod.yml -f docker-compose.edge.yml up -d
    ports:
      - '${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80'
    env_file: .env
    volumes:
      - ./Caddyfile.proxy:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # TLS certificates
      - caddy_config:/config
      - app_storage:/app/storage  # uploads, backups, logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    image: ghcr.io/oluxstudio/cms_v2:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php artisan queue:work --tries=1 --timeout=620 --memory=512
    env_file: .env
    volumes:
      - app_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    # The image's built-in check probes the FrankenPHP web server (:2019),
    # which these worker containers never start — so they'd always show
    # "unhealthy". Check the worker process itself instead.
    healthcheck:
      # No pgrep/ps in the image — scan /proc for the worker's command line.
      test: ['CMD-SHELL', 'for p in /proc/[0-9]*; do tr "\0" " " < $$p/cmdline 2>/dev/null | grep -q "queue:work" && exit 0; done; exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    image: ghcr.io/oluxstudio/cms_v2:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    volumes:
      - app_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'for p in /proc/[0-9]*; do tr "\0" " " < $$p/cmdline 2>/dev/null | grep -q "schedule:work" && exit 0; done; exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
      interval: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  app_storage:
  mysql_data:
  redis_data:
